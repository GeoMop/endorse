flow123d_version: 4.0.0
problem: !Coupling_Sequential
  description: |
      Homogenisation micro Darcy-Dispersion 3D model of the part of the tunnel.
      Driven by given pressure and concentration gradient.
  mesh:
    # Input mesh with 'outer' and 'borehole' regions.
    mesh_file: <mesh_file>
  flow_equation: !Flow_Darcy_LMH
    output_specific:
    nonlinear_solver:
      linear_solver: !Petsc
        a_tol: 1e-15
        r_tol: 1e-15
        options: -ksp_type cg -pc_type hypre -pc_hypre_type boomeramg  -pc_hypre_boomeramg_coarsen_type HMIS -pc_hypre_boomeramg_strong_threshold 0.5  -ksp_monitor
    input_fields:
      - region: .BOUNDARY
        bc_type: dirichlet
        bc_piezo_head: !FieldFormula
          value: "<pressure_grad> @ [x,y,z]"
      - region: BULK
        conductivity: !FieldFE
          mesh_data_file: <mesh_file>
          field_name: conductivity
      - region: fractures
        cross_section: !FieldFE
          mesh_data_file: <mesh_file>
          field_name: cross_section

    output:
      fields:
        - piezo_head_p0
        - pressure_p0
        #- pressure_p1
        - velocity_p0
        - region_id
        - conductivity
        #- anisotropy
        - cross_section

    balance: {}
    output_stream:
      format: !gmsh
