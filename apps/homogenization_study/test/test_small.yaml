
debug_output: true

homogenization:
  subdivision: [2, 1, 1]
  # Fail before the first microscale Flow123d solve if a macro element has no contributing micro barycentre.
  coverage_preflight: true
  # Linear scale of the averaging tetrahedron relative to its macro mesh element.
  macro_element_scale: 2.0
  pressure_loads: [ [ 1,0,0 ], [ 0,1,0 ], [ 0,0,1 ] ]
  boundary_mesh_step: 30

mesh:
    geometry:
      # x,y,z dimension
      box_dimensions: [ 100, 100, 100 ]
      box_center: [ 0, 0, 0 ]
      include: [fractures]

    # base of the mesh file name
    mesh_name: micro_mesh

    meshing_seed: 1
    # mesh step on outer boundary
    boundary_mesh_step: 20
    fracture_mesh_step: 10

transport_microscale:
    input_template: test_small_tmpl.yaml
    load_field_indirect_conductivity: "conductivity"
    response_field_p0: "velocity_p0"

    region_conductivity: { box_A: 1.0e-5, box_B: 2.0e-5 }
    fracture_conductivity: 1.0e-3
    fracture_aperture: 0.1
    fracture_angle_degrees: 45.0
    uniform_relative_tolerance: 1.0e-5


machine_config:
    # automatic resolution according to the socket.gethostname()
    # content of the 'machine_config' dict is filled by the particular
    # machine configuration dict
