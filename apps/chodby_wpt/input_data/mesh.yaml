mesh_name: wpt_section
boreholes: !include ./boreholes.yaml

borehole_section:
  borehole: L5-37R
  section: 1

# It is possible to specify which fractures to include.
# E.g. [1, 3] or [fracture_1, fracture_3] ... index of fracture local to borehole (see boreholes.yaml).
fractures: all

geometry:
  borehole_radius: 0.038
  domain_radius: 1.0

mesh:
  boundary_mesh_step: 0.6
  borehole_mesh_step: 0.15
  refinement:
    r_inner: 0.15
    h_inner: 0.15
    r_outer: 0.5
    h_outer: 0.25
    q_outer: 1
    r_inf: 1.0
    h_inf: 0.6
