# =================================================================================================
# MASTER CONFIG 
# Every other configs/*.yaml is DERIVED from this file for private use.
# =================================================================================================

machine_config:
    # resolved automatically by socket.gethostname()
    LAPTOP-MM6A3LRF:  # Ronald Siddall, Windows + Docker Desktop
        flow_executable:
        # docker wrapper around flow123d/ci-gnu:4.0.3dev_e651b9; translates CWD to container path
        - C:/Plocha/Semestral_internship_cvut/endorse/venv/Scripts/python.exe
        - C:/Plocha/Semestral_internship_cvut/endorse/apps/upscale_m/flow_win_wrapper.py

geometry:
    # Edge of the inner homogenization (averaging) cube [m].
    L_inner: 10.0
    # Outer cube edge = L_ext_factor * L_inner
    L_ext_factor: 1.6
    # Outer-boundary region names
    boundary_regions: [.side_x0, .side_x1, .side_y0, .side_y1, .side_z0, .side_z1]
    # SUBC only: edge length of the 3 support tetrahedra (as a fraction of L_inner)
    support_fraction_d: 0.1

    # Region names
    bulk_region: box
    fracture_region_prefix: fam_
    support_region: support_tetras_volume

fractures:
    stochastic:
        seed: 1234  # numpy global-generator seed used by bgem sampling
        population:
            fam_1:
                trend: 0.0
                plunge: 90.0
                concentration: 10
                power: 3.2
                r_0: 0.5
                r_infty: 2.5
                p_32: 2
            # fam_2:
            #     trend: 90.0
            #     plunge: 0.0
            #     concentration: 20
            #     power: 3
            #     r_0: 0.5
            #     r_infty: 2.5
            #     p_32: 2
        # optional (bgem sizes): restrict generated sizes, Population.set_sample_range
        sample_range: [0.5, 2.5]

mesh:
    # Base name of the generated mesh files
    mesh_name: micro_mesh
    fracture_mesh_step: 0.8
    # CharacteristicLengthMin = fracture_mesh_step / mesh_size_min_fraction.
    mesh_size_min_fraction: 10.0
    # disc approximation: minimum number of boundary points per full circle (gmsh option
    # Mesh.MinimumCirclePoints via bgem mesh options)
    min_circle_points: 16
    # minimum number of points per curved edge (gmsh option Mesh.MinimumCurvePoints via bgem
    # mesh options).
    min_curve_points: 16
    tolerance: 1e-6
    tolerance_boolean: 1e-5
    tolerance_initial_delaunay: 0.01
    heal_gamma_tol: 0.01

materials:
    young_modulus_rock: 1e9        # Pa
    poisson_ratio_rock: 0.25
    young_modulus_fracture: 1e3    # Pa
    poisson_ratio_fracture: 0.25
    # initial fracture thickness (cross_section): delta = aperture_per_r * r, where r is the
    # geometric disc radius (micro_mesh.make_cross_section_field), not the bgem size.
    aperture_per_r: 1e-3

loads:
    output_fields_file: output/mechanics_fields.msh
    stress_field_name: stress
    region_id_field_name: region_id
    # 'kubc', 'subc' or 'both'
    bc_type: both

    input_template_kubc: mechanics_kubc_tmpl.yaml
    input_template_subc: mechanics_subc_tmpl.yaml
    # KUBC loading parameter beta (dimensionless) and SUBC parameter alpha [Pa]
    deformation_parameter_beta: 1e-2
    stress_parameter_alpha: 1e6

    case_names_kubc: [E_11, E_22, E_33, E_23, E_13, E_12]
    case_dir_names_kubc:
        - kubc_normal_E_11
        - kubc_normal_E_22
        - kubc_normal_E_33
        - kubc_shear_E_23
        - kubc_shear_E_13
        - kubc_shear_E_12
    case_names_subc: [S_11, S_22, S_33, S_23, S_13, S_12]
    case_dir_names_subc:
        - subc_normal_S_11
        - subc_normal_S_22
        - subc_normal_S_33
        - subc_shear_S_23
        - subc_shear_S_13
        - subc_shear_S_12

# Macro (homogenized) mechanics model: coarse fracture-free tet mesh of the inner cube, one
# effective elastic tensor per macro element
mechanics_macroscale:
    # file name of the generated coarse mesh, inside the run dir
    mesh_file: macro_mesh.msh
    # P0 field carrying the 36 row-major components of each 6x6 tensor;
    tensor_field_name: elastic_tensor_voigt

    mesh_size_min_fraction: 10.0

    mesh_step: 2.5
    # per-element tensor field file (36 Voigt components C[6x6] row-major, endorse fields_file
    # format: msh2 + vtu preview), written under kubc/ / subc/ next to that BC type's report
    tensor_field_file: macro_elastic_tensor.msh2

# DNS problem (dns_mechanics_model.py). It IS the micro problem, with exactly two things fixed:
#   1. L_ext == L_inner (no buffer) -- forced to 1.0 in code, deliberately NOT a key here,
#      because "no buffer" is the definition of the DNS, not a tunable.
#   2. the product is per-element STRESS and STRAIN FIELDS (.vtu + .msh2 per load case and BC
#      type), not effective tensors.
# The DNS builds its OWN MESH (its own element size below) but on the SAME ROCK: the DFN is
# sampled in the BUFFERED box, exactly as the micro problem samples it, and the smaller meshed
# cube then CLIPS those fractures at its boundary. So the fractures inside the DNS cube ARE the
# fractures inside the micro problem's averaging cube -- same individual discs, not another draw
# with the same statistics. That is what lets the two be compared field against field rather than
# only in distribution
dns:
    mesh_step: 0.5
    # base name for the DNS mesh files -- MUST differ from mesh.mesh_name
    mesh_name: dns_mesh

