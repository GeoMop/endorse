# ---------------------------------------------------------------------------------------------
# Flow123d input for ONE load case of the upscale_m micro problem --  KUBC conditions
# Generated from flow123d_templates/mechanics_kubc_tmpl.yaml
#
# Linear elastic fractured cube. The whole outer boundary carries a prescribed displacement
# u_i = E_ij x_j, with E the macroscopic strain of this load case.
# ---------------------------------------------------------------------------------------------

flow123d_version: 4.0.3dev_e651b9

problem: !Coupling_Sequential
  description: "<description>"
  mesh:
    mesh_file: <mesh_file>

  flow_equation: !Coupling_Iterative
    input_fields:
      - region: <bulk_regions>
    time:
      end_time: 1.0
    a_tol: 1e-18
    r_tol: 1e-18

    flow_equation: !Flow_Darcy_LMH
      gravity: [0, 0, 0]
      input_fields:
        - region: <fracture_regions>
          cross_section: !FieldFE
            mesh_data_file: <cross_section_file>
            field_name: cross_section

        - region: <bulk_regions>
          bc_type: dirichlet
          bc_pressure: 0

      output:
        fields: []

    mechanics_equation: !Elasticity_Linear
      output_stream:
        format: !gmsh
      output:
        fields:
          - displacement
          - stress
          - region_id
          - cross_section_updated

      solver: !Petsc
        a_tol: 1e-14
        r_tol: 1e-14

      input_fields:
        - region: <bulk_regions>
          young_modulus: <rock_young_modulus>
          poisson_ratio: <rock_poisson_ratio>

        - region: <fracture_regions>
          young_modulus: <fracture_young_modulus>
          poisson_ratio: <fracture_poisson_ratio>

        - region: <boundary_regions>
          bc_type: displacement
          bc_displacement: !FieldFormula
            value: "<bc_displacement_matrix> @ [x,y,z]"
