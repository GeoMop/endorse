# ---------------------------------------------------------------------------------------------
# Flow123d input for ONE load case of the upscale_m macro problem, SUBC conditions
# Generated from flow123d_templates/mechanics_macro_subc_tmpl.yaml
#
# The homogenized counterpart of the micro problem: the coarse mesh without any fractures of
# the inner cube, one effective elastic tensor per macro element.
#
# The tensor comes in as six 3x3 fields, named: stiffness_tensor_0 .. stiffness_tensor_5
# ---------------------------------------------------------------------------------------------

# This Flow123d version supports Cauchy tensor as an input
flow123d_version: 4.0.3dev_9e91fe

problem: !Coupling_Sequential
  description: "<description>"
  mesh:
    mesh_file: <mesh_file>

  flow_equation: !Coupling_Iterative
    input_fields:
      - region: <bulk_regions>
    time:
      end_time: 1.0
    a_tol: 1e-18
    r_tol: 1e-18

    flow_equation: !Flow_Darcy_LMH
      gravity: [0, 0, 0]
      input_fields:
        - region: <bulk_regions>
          bc_type: dirichlet
          bc_pressure: 0

      output:
        fields: []

    mechanics_equation: !Elasticity_Linear
      output_stream:
        format: !gmsh
      output:
        fields:
          - stress
          - displacement
          - region_id

      solver: !Petsc
        a_tol: 1e-14
        r_tol: 1e-10

      input_fields:
        - region: <bulk_regions>
          elasticity_type: general
          stiffness_tensor_0: !FieldFE
            mesh_data_file: <tensor_field_file>
            field_name: <stiffness_field_0>
          stiffness_tensor_1: !FieldFE
            mesh_data_file: <tensor_field_file>
            field_name: <stiffness_field_1>
          stiffness_tensor_2: !FieldFE
            mesh_data_file: <tensor_field_file>
            field_name: <stiffness_field_2>
          stiffness_tensor_3: !FieldFE
            mesh_data_file: <tensor_field_file>
            field_name: <stiffness_field_3>
          stiffness_tensor_4: !FieldFE
            mesh_data_file: <tensor_field_file>
            field_name: <stiffness_field_4>
          stiffness_tensor_5: !FieldFE
            mesh_data_file: <tensor_field_file>
            field_name: <stiffness_field_5>

        # To prevent rigid body motions
        - region: [.support_origin_X, .support_origin_Y, .support_origin_Z,
                   .support_tetra_one_norm_Y, .support_tetra_one_norm_Z, .support_tetra_two_norm_Z]
          bc_type: displacement_n
          bc_displacement: 0

        - region: .side_x0
          bc_type: traction
          bc_traction: <traction_x0>

        - region: .side_x1
          bc_type: traction
          bc_traction: <traction_x1>

        - region: .side_y0
          bc_type: traction
          bc_traction: <traction_y0>

        - region: .side_y1
          bc_type: traction
          bc_traction: <traction_y1>

        - region: .side_z0
          bc_type: traction
          bc_traction: <traction_z0>

        - region: .side_z1
          bc_type: traction
          bc_traction: <traction_z1>
